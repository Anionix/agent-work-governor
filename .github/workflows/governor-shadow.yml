# LLM-CONTRACT
# id: agent-work-governor.proof-slow-cross-runner
# state: PROOF_SLOW_SUCCESS + TRUSTED_CONTROL + CANDIDATE_HEAD -> TRUSTED_PLAN -> ISOLATED_RUN -> PARITY_EVIDENCE | SHADOW_REGRESSION | SHADOW_INCONCLUSIVE
# preconditions: one successful relevant-path proof-slow run supplies an exact candidate SHA
# invariant: only default-branch Governor bytes run as trusted; shadow never grants merge authority
# failure: setup faults fail this non-required job and governed faults remain typed observations
# source: https://github.com/github/docs/blob/ee27de73e024106c5cf1f3938cf00bb477252862/content/actions/reference/workflows-and-actions/events-that-trigger-workflows.md
# knowledge: bundle:knowledge/policies/work-governor.md
# enforced_by: observe
# test: bundle:tests/test_contracts.py

name: proof-slow-cross-runner

on:
  workflow_run:
    workflows: [proof-slow-nix]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  select:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    name: proof-slow / cross-runner / select
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.proof.outputs.run }}
    steps:
      - name: Require a completed Nix proof
        id: proof
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # LLM contract: trusted workflow-run jobs -> PROOF_COMPLETED | NO_CROSS_RUNNER.
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = (
              f"{os.environ['GH_API_URL']}/repos/{os.environ['GH_REPOSITORY']}"
              f"/actions/runs/{os.environ['GH_RUN_ID']}/jobs?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  jobs = json.load(response)["jobs"]
          except (OSError, TimeoutError, urllib.error.URLError) as error:
              print(json.dumps({
                  "classification": "INFRA_INCONCLUSIVE",
                  "code": "PROOF_JOB_READBACK_FAILED",
                  "error": type(error).__name__,
                  "status": "INCONCLUSIVE",
              }, sort_keys=True))
              raise SystemExit(2) from error
          proof = [job for job in jobs if job["name"] == "proof-slow / nix"]
          if len(proof) != 1 or proof[0]["conclusion"] not in {"success", "skipped"}:
              raise SystemExit("SHADOW_INCONCLUSIVE: exact proof job is unavailable")
          run = str(proof[0]["conclusion"] == "success").lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={run}\n")
          print(json.dumps({"proof_conclusion": proof[0]["conclusion"], "run": run}))
          PY

  observe:
    needs: select
    if: >-
      needs.select.outputs.run == 'true'
    name: proof-slow / cross-runner / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Source: https://github.com/github/docs/blob/ee27de73e024106c5cf1f3938cf00bb477252862/content/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job.md
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    concurrency:
      group: proof-slow-cross-runner-${{ github.event.workflow_run.id }}-${{ matrix.runner }}
      cancel-in-progress: true
    env:
      CANDIDATE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CANDIDATE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      CONTROL_SHA: ${{ github.sha }}
      LEGACY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUNNER_LABEL: ${{ matrix.runner }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out the trusted default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          ref: ${{ env.CONTROL_SHA }}

      - name: Check out the observed candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          path: subject
          persist-credentials: false
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_HEAD_SHA }}
          submodules: false

      - name: Install locked Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Observe trusted Plan, isolated execution, and trusted Verify
        shell: bash
        run: |
          # LLM contract: default control + immutable candidate snapshot ->
          # typed shadow evidence; no candidate tool establishes trust or PASS.
          # Primary source: https://slsa.dev/spec/v1.2/verifying-artifacts
          set -euo pipefail
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$LEGACY_CONCLUSION" == success ]]
          control="$GITHUB_WORKSPACE/control"
          subject="$GITHUB_WORKSPACE/subject"
          test "$(git -C "$control" rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git -C "$subject" rev-parse HEAD)" = "$CANDIDATE_HEAD_SHA"
          test -z "$(git -C "$subject" status --porcelain)"
          output="$RUNNER_TEMP/governor-shadow"
          mkdir -p "$output"
          package="$(
            nix build --no-update-lock-file --no-write-lock-file \
              "path:$control#default" --no-link --print-out-paths
          )"
          rust_inputs="$(
            nix build --no-update-lock-file --no-write-lock-file \
              "path:$control#shadow-inputs" --no-link --print-out-paths
          )"
          nix develop --no-update-lock-file --no-write-lock-file \
            "path:$control" --command bash -s -- \
            "$control" "$subject" "$output" "$package" "$rust_inputs" <<'SHADOW'
          set -euo pipefail
          control=$1
          subject=$2
          output=$3
          package=$4
          rust_inputs=$5
          plugin="$package/share/agent-work-governor"
          python="$(command -v python)"
          hash_file() { nix hash file --type sha256 --base16 "$1"; }
          git -C "$subject" archive "$CANDIDATE_HEAD_SHA" > "$output/repository.tar"
          subject_store="$(nix store add-path "$subject")"
          candidate_archive_sha="$(hash_file "$output/repository.tar")"
          candidate_store_sha="$(
            nix hash path --type sha256 --base16 "$subject_store"
          )"
          control_manifest_sha="$(hash_file "$plugin/bin/manifest.json")"
          rust_inputs_sha="$(nix hash path --type sha256 --base16 "$rust_inputs")"
          printf '%s' "$CANDIDATE_HEAD_SHA" > "$output/revision"
          printf '%s\n%s\n%s\n%s\n' "$CONTROL_SHA" "$control_manifest_sha" \
            "$rust_inputs_sha" "$RUNNER_LABEL" > "$output/environment"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$CONTROL_SHA" "$CANDIDATE_REPOSITORY" "$CANDIDATE_HEAD_SHA" \
            "$candidate_archive_sha" "$candidate_store_sha" "$WORKFLOW_RUN_ID" \
            "$WORKFLOW_RUN_ATTEMPT:$RUNNER_LABEL" "$rust_inputs_sha" \
            > "$output/invocation"
          revision_sha="$(hash_file "$output/revision")"
          policy_sha="$(hash_file "$plugin/assets/presets/owner-original.toml")"
          toolchain_sha="$(hash_file "$plugin/toolchain.lock.json")"
          invocation_sha="$(hash_file "$output/invocation")"
          harness_sha="$(hash_file "$plugin/scripts/bounded_harness.py")"
          # LLM contract: trusted Nix Python closure -> store-only import path
          # or fail before candidate execution; cwd/ambient imports never enter.
          # Primary source: https://github.com/python/cpython/blob/c63aec69bd59c55314c06c23f4c22c03de76fe45/Doc/using/cmdline.rst
          trusted_pythonpath="${PYTHONPATH-}"
          trusted_pythonpath="$(
            "$python" -I -S - "$trusted_pythonpath" <<'PYTHONPATH_CHECK'
          import sys
          from pathlib import Path

          store = Path("/nix/store")
          paths = sys.argv[1].split(":")
          if not paths or any(not path for path in paths):
              raise SystemExit("trusted PYTHONPATH contains an empty component")
          canonical = []
          for raw in paths:
              path = Path(raw)
              try:
                  resolved = path.resolve(strict=True)
              except OSError as error:
                  raise SystemExit("trusted PYTHONPATH cannot be resolved") from error
              if path != resolved or not resolved.is_dir() or not resolved.is_relative_to(store):
                  raise SystemExit("trusted PYTHONPATH escaped the Nix store")
              canonical.append(str(resolved))
          sys.stdout.write(":".join(canonical))
          PYTHONPATH_CHECK
          )"
          root_environment=(
            "PATH=$PATH"
            "PYTHONHASHSEED=0"
            "PYTHONNOUSERSITE=1"
            "PYTHONPATH=$trusted_pythonpath"
          )
          wrapper_environment=()
          wrapper_suffix=
          # LLM contract: one trusted native Nix wrapper marker per
          # family/role -> preserved linker flags or refusal before execution.
          # Primary sources:
          # https://github.com/NixOS/nixpkgs/blob/624af665418d3c65d544145b4d34ad696439570e/pkgs/build-support/setup-hooks/role.bash#L52-L61
          # https://github.com/NixOS/nixpkgs/blob/624af665418d3c65d544145b4d34ad696439570e/pkgs/build-support/cc-wrapper/default.nix#L141-L148
          # https://github.com/NixOS/nixpkgs/blob/624af665418d3c65d544145b4d34ad696439570e/pkgs/build-support/bintools-wrapper/default.nix#L107-L110
          for family in CC BINTOOLS; do
            for role in BUILD HOST; do
              prefix="NIX_${family}_WRAPPER_TARGET_${role}_"
              selected=
              suffix=
              while IFS='=' read -r name value; do
                [[ "$name" == "$prefix"* ]] || continue
                [[ "$name" =~ ^NIX_(CC|BINTOOLS)_WRAPPER_TARGET_(BUILD|HOST)_[A-Za-z0-9_]+$ ]]
                [[ "$value" == 1 && -z "$selected" ]]
                selected="$name=$value"
                suffix=${name#"$prefix"}
              done < <(env)
              [[ -n "$selected" && -n "$suffix" ]]
              if [[ -n "$wrapper_suffix" ]]; then
                [[ "$suffix" == "$wrapper_suffix" ]]
              else
                wrapper_suffix=$suffix
              fi
              wrapper_environment+=("$selected")
            done
          done
          root_environment+=("${wrapper_environment[@]}")
          printf '%s\n' "${wrapper_environment[@]}" >> "$output/environment"
          environment_sha="$(hash_file "$output/environment")"
          for name in AR AR_FOR_BUILD AS AS_FOR_BUILD CC CC_FOR_BUILD \
            CONFIG_SHELL CPATH CXX CXX_FOR_BUILD LD LD_DYLD_PATH LD_FOR_BUILD \
            LIBRARY_PATH RANLIB RANLIB_FOR_BUILD SDKROOT MACOSX_DEPLOYMENT_TARGET \
            NIX_BINTOOLS NIX_BINTOOLS_FOR_BUILD NIX_BUILD_CORES NIX_CC \
            NIX_CC_FOR_BUILD NIX_CFLAGS_COMPILE NIX_CFLAGS_COMPILE_FOR_BUILD \
            NIX_LDFLAGS NIX_LDFLAGS_FOR_BUILD NIX_SSL_CERT_FILE SSL_CERT_FILE
          do
            value=${!name-}
            if [[ -n "$value" ]]; then
              root_environment+=("$name=$value")
            fi
          done
          bindings=(
            --repository-sha256 "$candidate_store_sha"
            --revision-sha256 "$revision_sha"
            --policy-sha256 "$policy_sha"
            --toolchain-sha256 "$toolchain_sha"
            --environment-sha256 "$environment_sha"
          )
          project=(
            mixed-uv-cargo
            --python-working-directory .
            --rust-working-directory rust
          )
          plan="$output/plan.json"
          runtime="/tmp/agent-work-governor-shadow-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RUNNER_LABEL"
          receipt="$runtime/run.json"
          plan_exit=0
          harness_exit=-1
          verify_exit=-1
          (
            cd "$subject_store"
            "$python" "$plugin/scripts/rust_dispatch.py" \
              plan "${bindings[@]}" "${project[@]}"
          ) > "$plan" 2> "$output/plan.stderr" || plan_exit=$?
          plan_sha=
          if (( plan_exit == 0 )); then
            plan_sha="$(
              "$python" -c \
                'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["execution_plan_sha256"])' \
                "$plan"
            )"
            if [[ "$(uname -s)" == Linux ]]; then
              bwrap="$(readlink -f "$(command -v bwrap)")"
              [[ "$bwrap" =~ ^/nix/store/[0-9a-z]{32}-bubblewrap-[^/]+/bin/bwrap$ ]]
              [[ -x "$bwrap" ]]
              restriction="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || printf 0)"
              [[ "$restriction" == 0 || "$restriction" == 1 ]]
              if [[ "$restriction" == 1 ]]; then
                # LLM contract: TRUSTED_CONTROL_BWRAP + ACTIVE_RESTRICTION ->
                # EXACT_USERNS_PROFILE -> SHADOW_RUN -> PROFILE_REMOVED | FAILURE.
                # Primary source: https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
                apparmor_profile="$(mktemp "$RUNNER_TEMP/agent-work-governor-bwrap.XXXXXX")"
                printf 'abi <abi/4.0>,\ninclude <tunables/global>\n%s flags=(unconfined) {\n  userns,\n}\n' \
                  "$bwrap" > "$apparmor_profile"
                sudo /usr/sbin/apparmor_parser -r "$apparmor_profile"
                trap 'sudo /usr/sbin/apparmor_parser -R "$apparmor_profile"' EXIT
              fi
            fi
            harness_exit=0
            sudo /usr/bin/env -i "${root_environment[@]}" "$python" -B \
              "$plugin/scripts/bounded_harness.py" \
              --plan-report "$plan" \
              --expected-plan-sha256 "$plan_sha" \
              --repository "$subject_store" \
              --invocation-sha256 "$invocation_sha" \
              --receipt "$receipt" \
              --runtime-root "$runtime" \
              --trusted-rust-inputs "$rust_inputs" \
              > "$output/harness.json" 2> "$output/harness.stderr" \
              || harness_exit=$?
            if [[ -n "${apparmor_profile:-}" ]]; then
              sudo /usr/sbin/apparmor_parser -R "$apparmor_profile"
              apparmor_profile=
              trap - EXIT
            fi
          fi
          if (( plan_exit == 0 && harness_exit == 0 )); then
            evidence=()
            while IFS= read -r name; do
              evidence+=(--evidence "$name.log")
            done < <(
              "$python" -c \
                'import json,sys; print(*[item["identifier"] for item in json.load(open(sys.argv[1], encoding="utf-8"))["execution_plan"]["checks"]], sep="\n")' \
                "$plan"
            )
            verify_exit=0
            (
              cd "$subject_store"
              sudo /usr/bin/env -i "${root_environment[@]}" "$python" -B \
                "$plugin/scripts/rust_dispatch.py" verify "${bindings[@]}" \
                --expected-harness-sha256 "$harness_sha" \
                --expected-invocation-sha256 "$invocation_sha" \
                --receipt "$receipt" \
                --evidence-root "$runtime/evidence" \
                "${evidence[@]}" "${project[@]}"
            ) > "$output/verify.json" 2> "$output/verify.stderr" \
              || verify_exit=$?
          fi
          sudo /usr/bin/env -i "$python" -B - "$output" "$runtime" \
            "$CONTROL_SHA" "$CANDIDATE_REPOSITORY" "$CANDIDATE_HEAD_SHA" \
            "$candidate_archive_sha" "$candidate_store_sha" \
            "$control_manifest_sha" "$rust_inputs_sha" "$RUNNER_LABEL" "$WORKFLOW_RUN_ID" \
            "$WORKFLOW_RUN_ATTEMPT" "$plan_exit" "$harness_exit" \
            "$verify_exit" <<'PYTHON' > "$output/shadow.json"
          import hashlib
          import json
          import sys
          from pathlib import Path

          (
              output,
              runtime,
              control_sha,
              candidate_repository,
              candidate_head_sha,
              candidate_archive_sha,
              candidate_store_sha,
              control_manifest_sha,
              rust_inputs_sha,
              runner,
              workflow_run_id,
              workflow_run_attempt,
              plan_exit,
              harness_exit,
              verify_exit,
          ) = sys.argv[1:]
          output, runtime = Path(output), Path(runtime)
          exits = {
              "plan": int(plan_exit),
              "harness": int(harness_exit),
              "verify": int(verify_exit),
          }

          def content(path):
              try:
                  data = path.read_bytes()
              except OSError:
                  return None, None
              return data, hashlib.sha256(data).hexdigest()

          def document(path):
              data, digest = content(path)
              try:
                  value = json.loads(data) if data is not None else None
              except (UnicodeError, json.JSONDecodeError):
                  value = None
              return value if isinstance(value, dict) else None, digest

          def reasons(value):
              found = set()
              if isinstance(value, dict):
                  for key in ("code", "reason"):
                      if isinstance(value.get(key), str):
                          found.add(value[key])
                  for item in value.get("findings", []):
                      if isinstance(item, dict):
                          for key in ("code", "reason"):
                              if isinstance(item.get(key), str):
                                  found.add(item[key])
              return found

          # LLM contract: trusted fault v0.3 + fixed NetworkStage + bounded
          # launcher digest -> public shadow evidence | null; unknown schema,
          # malformed digests, and candidate text are ignored.
          # Primary source: bundle:scripts/bounded_harness.py
          def network_preflight(value):
              allowed = {
                  "network-sandbox-select",
                  "network-host-canaries",
                  "network-candidate-start",
                  "network-candidate-create",
                  "network-candidate-ready-eof",
                  "network-candidate-ready-output",
                  "network-candidate-ready-timeout",
                  "network-candidate-linux-loopback-rtnetlink-eperm",
                  "network-candidate-result",
                  "network-candidate-socket-create-unexpected",
                  "network-candidate-socket-operation-unexpected",
                  "network-candidate-process-exit-unexpected",
                  "network-trusted-start",
                  "network-trusted-create",
                  "network-trusted-ready-eof",
                  "network-trusted-ready-output",
                  "network-trusted-ready-timeout",
                  "network-trusted-linux-loopback-rtnetlink-eperm",
                  "network-trusted-result",
              }
              fields = {
                  "code",
                  "completed",
                  "failed",
                  "launcher_diagnostic_sha256",
                  "not_started",
                  "running",
                  "schema_version",
                  "stage",
                  "state",
              }
              if (
                  not isinstance(value, dict)
                  or set(value) != fields
                  or value.get("schema_version") != "0.3"
                  or value.get("state") != "HARNESS_FAULT"
              ):
                  return None, None
              stage = value.get("stage")
              if stage is not None and (
                  not isinstance(stage, str) or stage not in allowed
              ):
                  return None, None
              policy_stages = {
                  "network-candidate-socket-create-unexpected",
                  "network-candidate-socket-operation-unexpected",
                  "network-candidate-process-exit-unexpected",
              }
              if (
                  stage in policy_stages
                  and value.get("code")
                  != "HARNESS_NETWORK_SANDBOX_POLICY_UNSUPPORTED"
              ):
                  return None, None
              if (
                  stage == "network-candidate-result"
                  and value.get("code")
                  == "HARNESS_NETWORK_SANDBOX_POLICY_UNSUPPORTED"
              ):
                  return None, None
              digest = value.get("launcher_diagnostic_sha256")
              if digest is not None and (
                  not isinstance(digest, str)
                  or len(digest) != 64
                  or any(character not in "0123456789abcdef" for character in digest)
                  or value.get("code") != "HARNESS_NETWORK_SANDBOX_SETUP_FAILED"
              ):
                  return None, None
              digest_stages = {
                  "network-candidate-ready-output",
                  "network-candidate-linux-loopback-rtnetlink-eperm",
                  "network-trusted-ready-output",
                  "network-trusted-linux-loopback-rtnetlink-eperm",
              }
              if digest is not None and stage not in digest_stages:
                  return None, None
              fixed_digest_stages = {
                  "network-candidate-linux-loopback-rtnetlink-eperm",
                  "network-trusted-linux-loopback-rtnetlink-eperm",
              }
              fixed_digest = (
                  "d6d3a3b00b0b48907031e259b7ffed5025e92519672917a50181571db45a7036"
              )
              if stage in fixed_digest_stages and digest != fixed_digest:
                  return None, None
              return stage, digest

          # LLM contract: untrusted aggregate receipt -> bounded diagnostics;
          # only trusted Verify and stage exits determine the semantic state.
          # Primary source: https://github.com/slsa-framework/slsa/blob/ae7fc76215004e8fae250c877eff8919bf048e3b/spec/verifying-artifacts.md
          def observed_outcomes(value):
              found = []
              checks = value.get("checks", []) if isinstance(value, dict) else []
              if not isinstance(checks, list):
                  return found
              for item in checks:
                  if not isinstance(item, dict) or not isinstance(item.get("identifier"), str):
                      continue
                  outcome = item.get("outcome")
                  if outcome == "TIMED_OUT":
                      found.append({"identifier": item["identifier"], "outcome": "TIMED_OUT"})
                  elif isinstance(outcome, dict):
                      exited = outcome.get("EXITED")
                      code = exited.get("exit_code") if isinstance(exited, dict) else None
                      if isinstance(code, int) and not isinstance(code, bool):
                          found.append(
                              {
                                  "exit_code": code,
                                  "identifier": item["identifier"],
                                  "outcome": "EXITED",
                              }
                          )
              return sorted(found, key=lambda item: item["identifier"])

          # LLM contract: isolated rust.tests evidence -> finite public
          # diagnostic vocabulary; arbitrary candidate output is never emitted.
          # Primary source: https://doc.rust-lang.org/cargo/reference/external-tools.html#json-messages
          def rust_failure_diagnostics(value):
              checks = value.get("checks", []) if isinstance(value, dict) else []
              failed = next(
                  (
                      item
                      for item in checks
                      if isinstance(item, dict)
                      and item.get("identifier") == "rust.tests"
                      and item.get("outcome") != {"EXITED": {"exit_code": 0}}
                  ),
                  None,
              )
              if failed is None:
                  return None
              data, _ = content(runtime / "evidence" / "rust.tests.log")
              if data is None or len(data) > 1_048_576:
                  return {"signals": ["EVIDENCE_UNAVAILABLE"]}
              text = data.decode("utf-8", errors="replace")
              lowered = text.lower()
              signals = {
                  code
                  for needle, code in (
                      ("blocking waiting for file lock", "CARGO_LOCK_WAIT"),
                      ("could not execute process", "PROCESS_EXEC_FAILED"),
                      ("could not compile", "RUST_COMPILE_FAILED"),
                      ("failed to run custom build command", "BUILD_SCRIPT_FAILED"),
                      ("library not found for -l", "LINKER_LIBRARY_NOT_FOUND"),
                      ("cannot find -l", "LINKER_LIBRARY_NOT_FOUND"),
                      ("library not found for -liconv", "LINKER_ICONV_NOT_FOUND"),
                      ("linking with", "LINKER_FAILED"),
                      ("module not found", "PYTHON_IMPORT_FAILED"),
                      ("modulenotfounderror", "PYTHON_IMPORT_FAILED"),
                      ("no space left on device", "NO_SPACE"),
                      ("no such file or directory", "PATH_NOT_FOUND"),
                      ("operation not permitted", "OPERATION_NOT_PERMITTED"),
                      ("permission denied", "PERMISSION_DENIED"),
                      ("panicked at", "RUST_PANIC"),
                      ("read-only file system", "READ_ONLY_FILESYSTEM"),
                      ("test result: failed", "RUST_TEST_FAILED"),
                  )
                  if needle in lowered
              }
              permission_scopes = (
                  sorted(
                      code
                      for needle, code in (
                          (".global-cache", "CARGO_GLOBAL_CACHE"),
                          (".package-cache", "CARGO_PACKAGE_CACHE"),
                          ("cargo-target", "CARGO_TARGET"),
                          ("cargo-home", "CARGO_HOME"),
                      )
                      if needle in lowered
                  )
                  if "PERMISSION_DENIED" in signals
                  else []
              )
              if not signals:
                  signals.add("UNKNOWN_NONZERO")
              return {
                  "permission_scopes": permission_scopes,
                  "signals": sorted(signals),
              }

          plan, plan_digest = document(output / "plan.json")
          receipt, receipt_digest = document(runtime / "run.json")
          fault, _ = document(runtime / "run.json.fault.json")
          verify, verify_digest = document(output / "verify.json")
          reason_codes = reasons(plan) | reasons(fault) | reasons(verify)
          for stage, code in exits.items():
              if code == -1:
                  reason_codes.add(f"{stage.upper()}_NOT_RUN")
              elif code != 0:
                  reason_codes.add(f"{stage.upper()}_EXIT_{code}")
          evidence_digest = None
          evidence_root = runtime / "evidence"
          if evidence_root.is_dir():
              digest = hashlib.sha256()
              for path in sorted(evidence_root.glob("*.log")):
                  data = path.read_bytes()
                  name = path.name.encode()
                  digest.update(len(name).to_bytes(8, "big"))
                  digest.update(name)
                  digest.update(len(data).to_bytes(8, "big"))
                  digest.update(data)
              evidence_digest = digest.hexdigest()
          if all(code == 0 for code in exits.values()):
              state = "PARITY_EVIDENCE"
          elif 70 in exits.values():
              state = "SHADOW_INCONCLUSIVE"
          elif any(code not in (-1, 0) for code in exits.values()):
              state = "SHADOW_REGRESSION"
          else:
              state = "SHADOW_INCONCLUSIVE"
          if state != "PARITY_EVIDENCE" and not reason_codes:
              reason_codes.add("SHADOW_OUTPUT_INCOMPLETE")
          network_stage, launcher_digest = network_preflight(fault)
          result = {
              "candidate_archive_sha256": candidate_archive_sha,
              "candidate_head_sha": candidate_head_sha,
              "candidate_repository": candidate_repository,
              "candidate_store_sha256": candidate_store_sha,
              "control_manifest_sha256": control_manifest_sha,
              "control_sha": control_sha,
              "evidence_set_sha256": evidence_digest,
              "execution_plan_sha256": (
                  plan.get("execution_plan_sha256")
                  if isinstance(plan, dict)
                  else None
              ),
              "legacy_conclusion": "success",
              "launcher_diagnostic_sha256": launcher_digest,
              "network_preflight_stage": network_stage,
              "observed_check_outcomes": observed_outcomes(receipt),
              "rust_failure_diagnostics": rust_failure_diagnostics(receipt),
              "plan_report_sha256": plan_digest,
              "reason_codes": sorted(reason_codes),
              "receipt_sha256": receipt_digest,
              "rust_inputs_sha256": rust_inputs_sha,
              "runner": runner,
              "schema_version": "0.3",
              "stage_exit": exits,
              "state": state,
              "verify_report_sha256": verify_digest,
              "workflow_run_attempt": int(workflow_run_attempt),
              "workflow_run_id": int(workflow_run_id),
          }
          print(json.dumps(result, separators=(",", ":"), sort_keys=True))
          PYTHON
          cat "$output/shadow.json"
          {
            echo '### Agent Work Governor shadow evidence'
            echo '```json'
            cat "$output/shadow.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          SHADOW
