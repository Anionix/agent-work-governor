# LLM-CONTRACT
# id: agent-work-governor.harness-isolation
# state: PROTECTED_MAIN_REVISION -> PRIVILEGE_SEPARATION_TEST -> PASS | JOB_FAILURE
# preconditions: only a merged main revision can trigger this disposable hosted runner
# invariant: pull requests never execute candidate bytes as root; merged tests retain only pinned tools
# failure: missing pinned isolation tools or any UID/write/network regression fails the job
# source: https://github.com/github/docs/blob/ee27de73e024106c5cf1f3938cf00bb477252862/content/actions/reference/runners/github-hosted-runners.md
# knowledge: bundle:knowledge/policies/work-governor.md
# enforced_by: validate
# test: bundle:tests/test_contracts.py

name: harness-isolation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: harness / isolation / ubuntu-24.04 / authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # LLM contract: EXPLICIT_RUNNER + SHARED_PINNED_STEPS -> ONE_ROLE_JOB | JOB_FAILURE.
    # Primary source: https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases
    steps: &harness-isolation-steps
      - name: Check out the protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install locked Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Validate detached-process write isolation
        shell: bash
        run: |
          # LLM contract: merged harness + nobody child -> immutable receipt or failure.
          # Primary source: https://github.com/python/cpython/blob/c63aec69bd59c55314c06c23f4c22c03de76fe45/Doc/library/subprocess.rst
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python="$(
            nix develop --no-update-lock-file --no-write-lock-file --command \
              which python
          )"
          trusted_path="$(dirname "$python"):/usr/bin:/bin:/usr/sbin:/sbin"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            bwrap="$(
              nix develop --no-update-lock-file --no-write-lock-file --command \
                which bwrap
            )"
            bwrap="$(readlink -f "$bwrap")"
            [[ "$bwrap" =~ ^/nix/store/[0-9a-z]{32}-bubblewrap-[^/]+/bin/bwrap$ ]]
            [[ -x "$bwrap" ]]
            trusted_path="$(dirname "$bwrap"):$trusted_path"
            restriction="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || printf 0)"
            [[ "$restriction" == 0 || "$restriction" == 1 ]]
            if [[ "$restriction" == 1 ]]; then
              # LLM contract: LOCKED_BWRAP_PATH + ACTIVE_RESTRICTION ->
              # EXACT_USERNS_PROFILE -> TEST -> PROFILE_REMOVED | JOB_FAILURE.
              # Primary source: https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
              apparmor_profile="$(mktemp "$RUNNER_TEMP/agent-work-governor-bwrap.XXXXXX")"
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\n%s flags=(unconfined) {\n  userns,\n}\n' \
                "$bwrap" > "$apparmor_profile"
              sudo /usr/sbin/apparmor_parser -r "$apparmor_profile"
              trap 'sudo /usr/sbin/apparmor_parser -R "$apparmor_profile"' EXIT
            fi
          fi
          sudo /usr/bin/env -i \
            "HOME=$RUNNER_TEMP" \
            "PATH=$trusted_path" \
            "$python" -B -m unittest tests.test_bounded_harness
          if [[ -n "${apparmor_profile:-}" ]]; then
            sudo /usr/sbin/apparmor_parser -R "$apparmor_profile"
            apparmor_profile=
            trap - EXIT
          fi

  ubuntu-arm-shadow:
    name: harness / isolation / ubuntu-24.04-arm / shadow
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps: *harness-isolation-steps

  macos-shadow:
    name: harness / isolation / macos-15 / shadow
    runs-on: macos-15
    timeout-minutes: 10
    steps: *harness-isolation-steps
