# LLM-CONTRACT
# id: agent-work-governor.proof-slow-nix
# state: CHANGE_SET -> REQUIRED_REPOSITORY_CONTROLS -> PROOF_REQUIRED -> LOCKED_NIX_PROOF -> REQUIRED_PASS | CODE_FAIL | INFRA_INCONCLUSIVE; CHANGE_SET -> REQUIRED_REPOSITORY_CONTROLS -> NO_PROOF_CLAIM -> REQUIRED_PASS; PR_METADATA_EDIT -> PRIOR_SAME_HEAD_PROOF_WORKFLOW -> PROOF_WORKFLOW_IDENTITY_BOUND_SUCCESS | FULL_PROOF_FALLBACK | INFRA_INCONCLUSIVE
# preconditions: change sets and reconciliation events are classified; edited without changes.base is metadata-only
# invariant: every new head passes repository controls; non-documentation changes require Nix; a metadata edit that replaces pending proof inherits its proof obligation
# failure: code faults exit 1; infrastructure exits 2; missing prior proof falls back to full proof; malformed readback fails closed
# source: https://github.com/github/docs/blob/7e8499908e9935b0e437faea77e48dcf5284c222/content/actions/reference/workflows-and-actions/workflow-syntax.md
# knowledge: bundle:knowledge/policies/work-governor.md
# enforced_by: required
# test: bundle:tests/test_contracts.py

name: proof-slow-nix

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: read
  checks: read
  contents: read

env:
  PROOF_SKIP_PATTERN: '^(docs/|LICENSE$|NOTICE$|README\.md$)'

concurrency:
  group: proof-slow-nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  select:
    name: proof-slow / select
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      preserved: ${{ steps.metadata-proof.outputs.preserved }}
      required: ${{ steps.paths.outputs.required }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reconcile metadata-only proof
        if: github.event.action == 'edited' && github.event.changes.base == null
        id: metadata-proof
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # LLM contract: metadata-only event + workflow-bound immutable run history ->
          # PROOF_WORKFLOW_IDENTITY_BOUND_SUCCESS | FULL_PROOF_FALLBACK |
          # INFRA_INCONCLUSIVE.
          # Source: https://docs.github.com/rest/actions/workflow-runs#list-workflow-runs-for-a-workflow
          set -euo pipefail
          [[ "$GH_API_URL" == "https://api.github.com" ]]
          [[ "$GH_REPOSITORY" =~ ^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          query="
            def bound_run:
              select(
                (.id | type) == \"number\" and
                (.id | floor) == .id and .id > 0 and
                (.workflow_id | type) == \"number\" and
                (.workflow_id | floor) == .workflow_id and .workflow_id > 0 and
                (.run_attempt | type) == \"number\" and
                (.run_attempt | floor) == .run_attempt and .run_attempt > 0 and
                .name == \"proof-slow-nix\" and
                .path == \".github/workflows/proof-slow.yml\" and
                .head_sha == \"$PR_HEAD_SHA\" and
                .event == \"pull_request\" and
                .status == \"completed\" and
                .conclusion == \"success\" and
                .repository.full_name == \"$GH_REPOSITORY\"
              );
            [
              (if (
                (.total_count | type) == \"number\" and
                (.workflow_runs | type) == \"array\"
              ) then
                (.total_count | floor) == .total_count and .total_count >= 0
              else false end),
              .total_count,
              (.workflow_runs | length),
              ([.workflow_runs[] | bound_run] | length),
              ([.workflow_runs[] | bound_run | .id] | unique | length),
              ([.workflow_runs[] | bound_run | .workflow_id] | unique | length)
          ] | @tsv"
          readback() {
            gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GH_REPOSITORY/actions/workflows/proof-slow.yml/runs" \
              -f "head_sha=$PR_HEAD_SHA" \
              -f event=pull_request \
              -f status=success \
              -F per_page=100 \
              --jq "$query"
          }
          readback_exit=1
          evidence=""
          for _ in 1 2; do
            set +e
            evidence="$(readback)"
            readback_exit="$?"
            set -e
            [[ "$readback_exit" -eq 0 ]] && break
          done
          if [[ "$readback_exit" -ne 0 ]]; then
            echo '{"classification":"INFRA_INCONCLUSIVE","code":"PRIOR_PROOF_WORKFLOW_READBACK_FAILED","status":"INCONCLUSIVE"}'
            exit 2
          fi
          IFS=$'\t' read -r schema_valid total row_count prior_count \
            unique_count workflow_count extra <<<"$evidence"
          if [[ -n "${extra:-}" || "$schema_valid" != "true" ||
            ! "$total" =~ ^[0-9]{1,3}$ ||
            ! "$row_count" =~ ^[0-9]{1,3}$ ||
            ! "$prior_count" =~ ^[0-9]{1,3}$ ||
            ! "$unique_count" =~ ^[0-9]{1,3}$ ||
            ! "$workflow_count" =~ ^[0-9]{1,3}$ || "$total" -gt 100 ||
            "$total" -ne "$row_count" || "$row_count" -ne "$prior_count" ||
            "$prior_count" -ne "$unique_count" ||
            ( "$prior_count" -eq 0 && "$workflow_count" -ne 0 ) ||
            ( "$prior_count" -gt 0 && "$workflow_count" -ne 1 ) ]]; then
            echo '{"classification":"INFRA_INCONCLUSIVE","code":"PRIOR_PROOF_WORKFLOW_RESPONSE_INVALID","status":"INCONCLUSIVE"}'
            exit 2
          fi
          if [[ "$prior_count" -lt 1 ]]; then
            echo "preserved=false" >> "$GITHUB_OUTPUT"
            printf '{"classification":"CODE_OK","code":"PRIOR_PROOF_WORKFLOW_MISSING_FALLBACK","head_sha":"%s","status":"PASS"}\n' \
              "$PR_HEAD_SHA"
            exit 0
          fi
          echo "preserved=true" >> "$GITHUB_OUTPUT"
          printf '{"classification":"CODE_OK","code":"PRIOR_PROOF_WORKFLOW_IDENTITY_BOUND","head_sha":"%s","prior_successes":%s,"status":"PASS"}\n' \
            "$PR_HEAD_SHA" "$prior_count"

      - name: Check out the candidate revision
        if: steps.metadata-proof.outputs.preserved != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Select relevant proof input
        id: paths
        env:
          METADATA_PROOF_PRESERVED: ${{ steps.metadata-proof.outputs.preserved }}
        shell: bash
        run: |
          # LLM contract: event identity + changed paths -> PROOF_REQUIRED | NO_PROOF_CLAIM.
          set -euo pipefail
          if [[ "${METADATA_PROOF_PRESERVED:-}" == "true" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo '{"gate":"proof-slow-select","proof_required":false,"status":"PASS"}'
            exit 0
          fi
          required=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ||
            "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
              required=true
            else
              changed="$(
                git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA"
              )"
              if [[ -n "$changed" ]] &&
                grep -Evq "$PROOF_SKIP_PATTERN" <<<"$changed"; then
                required=true
              else
                required=false
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          printf '{"gate":"proof-slow-select","proof_required":%s,"status":"PASS"}\n' \
            "$required"

  nix:
    name: proof-slow / nix
    needs: select
    if: needs.select.result == 'success' && needs.select.outputs.preserved != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
    steps:
      - name: Record proof start
        if: needs.select.outputs.required == 'true'
        run: |
          # LLM contract: selected proof job -> timestamp or job failure.
          echo "PROOF_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # LLM contract: SHA-pinned workflow bootstrap -> REVIEWED_REVISION or job failure.
      # Preconditions: actions/checkout is intentionally outside toolchain.lock.json.
      # Invariant: this is the only action allowed before catalog validation.
      # Source: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Enforce required repository controls
        shell: bash
        run: |
          # LLM contract: reviewed tree + commit identities -> REQUIRED_CONTROLS_PASS | CODE_FAIL.
          bash scripts/validate_repository_controls.sh \
            "$BASE_SHA" "$EXPECTED_HEAD_SHA"

      - name: Validate unified toolchain catalog
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          # LLM contract: catalog bytes + declared projections ->
          # VALIDATED_UNIFIED_LOCK or stable rejection.
          # Primary source: https://github.com/Anionix/agent-work-governor/issues/3
          set -euo pipefail
          python3 scripts/toolchain_catalog.py toolchain.lock.json
          python3 scripts/project_toolchain_digest.py --check
          nix_version="$(
            python3 scripts/toolchain_catalog.py toolchain.lock.json --tool-version nix
          )"
          if [[ "$nix_version" != "2.34.7" ]]; then
            echo "::error title=TOOLCHAIN_NIX_INSTALLER_PIN_MISMATCH::expected=2.34.7 actual=$nix_version"
            exit 1
          fi
          if command -v nix >/dev/null 2>&1; then
            echo "::error title=TOOLCHAIN_NIX_PREINSTALLED::refusing an installer bypass"
            exit 1
          fi
          IFS=$'\t' read -r nix_source nix_digest < <(
            python3 scripts/toolchain_catalog.py toolchain.lock.json --tool-source nix
          )
          IFS=$'\t' read -r _ action_digest < <(
            python3 scripts/toolchain_catalog.py toolchain.lock.json \
              --tool-source cachix/install-nix-action
          )
          mapfile -t action_pins < <(
            sed -nE \
              's|^[[:space:]]*uses:[[:space:]]+cachix/install-nix-action@([0-9a-f]{40})([[:space:]]*(#.*)?)$|\1|p' \
              .github/workflows/proof-slow.yml
          )
          if [[ "${#action_pins[@]}" -ne 1 ||
            "git:${action_pins[0]:-}" != "$action_digest" ]]; then
            echo "::error title=TOOLCHAIN_ACTION_IDENTITY_MISMATCH::cachix/install-nix-action"
            exit 1
          fi
          expected_source="https://releases.nixos.org/nix/nix-${nix_version}/install"
          if [[ "$nix_source" != "$expected_source" ]]; then
            echo "::error title=TOOLCHAIN_NIX_SOURCE_MISMATCH::expected=$expected_source actual=$nix_source"
            exit 1
          fi
          nix_digest="${nix_digest#sha256:}"
          nix_installer="$RUNNER_TEMP/nix-install"
          if ! curl --fail --location --proto '=https' \
            --proto-redir '=https' --tlsv1.2 \
            --output "$nix_installer" "$nix_source"; then
            echo '{"classification":"INFRA_INCONCLUSIVE","code":"NIX_INSTALLER_TRANSPORT_FAILED","status":"INCONCLUSIVE"}'
            exit 2
          fi
          printf '%s  %s\n' "$nix_digest" "$nix_installer" |
            sha256sum --check --strict

      # LLM contract: pinned flake -> Nix environment or job failure.
      # Source: https://github.com/cachix/install-nix-action/releases/tag/v31.11.0
      - name: Install Nix
        if: needs.select.outputs.required == 'true'
        id: install-nix
        continue-on-error: true
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # The preceding step verifies the catalog-bound installer bytes.
          install_url: file://${{ runner.temp }}/nix-install

      - name: Classify Nix installation
        if: needs.select.outputs.required == 'true' && steps.install-nix.outcome != 'success'
        run: |
          # LLM contract: failed pinned installer -> typed infrastructure closure.
          echo '{"classification":"INFRA_INCONCLUSIVE","code":"NIX_INSTALL_FAILED","gate":"proof-slow-nix","status":"INCONCLUSIVE"}'
          exit 2

      - name: Verify regenerated flake lock pair
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-nix \
            --code FLAKE_LOCK_PAIR_FAILED \
            --infra-code FLAKE_LOCK_PAIR_INFRA \
            -- bash -euo pipefail <<'TYPED_COMMAND'
          # LLM contract: changed flake pair -> isolated regeneration ->
          # BYTE_EQUIVALENT or fail-closed mismatch/inconclusive evidence.
          # Primary source: https://github.com/NixOS/nix/blob/2c6d06e9387cf58167cb5a7ab91cee7333d8d17c/src/nix/flake-lock.md
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD_SHA" ]] ||
            [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            printf '{"code":"FLAKE_LOCK_CHECKOUT_IDENTITY_INVALID","expected_head_sha":"%s","head_sha":"%s","status":"INCONCLUSIVE"}\n' \
              "$EXPECTED_HEAD_SHA" "$actual_head"
            exit 2
          fi
          integration_log="$RUNNER_TEMP/flake-lock-integration.log"
          set +e
          AWG_RUN_NIX_INTEGRATION=1 python3 -B -m unittest \
            tests.test_flake_lock_pair.FlakeLockPairNixIntegrationTests \
            2>&1 | tee "$integration_log"
          integration_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$integration_status" -ne 0 ]]; then
            exit "$integration_status"
          fi
          if git diff --quiet "$BASE_SHA...$EXPECTED_HEAD_SHA" -- \
            flake.nix flake.lock; then
            echo '{"code":"FLAKE_PAIR_UNCHANGED","status":"SKIP"}'
            exit 0
          fi
          source_tree="$RUNNER_TEMP/flake-pair-source"
          regenerated="$RUNNER_TEMP/flake.lock.regenerated"
          mkdir -p "$source_tree"
          git archive "$EXPECTED_HEAD_SHA" | tar -x -C "$source_tree"
          if ! nix flake lock \
            --no-use-registries \
            --output-lock-file "$regenerated" \
            "path:$source_tree"; then
            python3 -B scripts/validate_flake_lock_pair.py \
              --flake-nix "$source_tree/flake.nix" \
              --committed-lock "$source_tree/flake.lock" \
              --regenerated-lock "$RUNNER_TEMP/flake.lock.regeneration-failed" \
              --head-sha "$EXPECTED_HEAD_SHA" \
              --nix-version "$(nix --version)"
          fi
          python3 -B scripts/validate_flake_lock_pair.py \
            --flake-nix "$source_tree/flake.nix" \
            --committed-lock "$source_tree/flake.lock" \
            --regenerated-lock "$regenerated" \
            --head-sha "$EXPECTED_HEAD_SHA" \
            --nix-version "$(nix --version)"
          TYPED_COMMAND

      - name: Assert installed Nix identity
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-nix \
            --code NIX_IDENTITY_FAILED \
            --infra-code NIX_IDENTITY_INFRA \
            -- bash -euo pipefail <<'TYPED_COMMAND'
          # LLM contract: installed executable -> EXACT_NIX or job failure.
          set -euo pipefail
          expected="$(
            nix develop --no-update-lock-file --no-write-lock-file --command \
              python scripts/toolchain_catalog.py toolchain.lock.json \
              --tool-version nix
          )"
          actual="$(nix --version)"
          if [[ "$actual" != "nix (Nix) $expected" ]]; then
            echo "::error title=TOOLCHAIN_VERSION_MISMATCH::nix expected=$expected actual=$actual"
            exit 1
          fi
          TYPED_COMMAND

      - name: Check Rust/Python differential acceptance
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          # LLM contract: one versioned corpus + vendored offline routes ->
          # exact authority parity or a separately typed code/infra failure.
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-differential \
            --code DIFFERENTIAL_ACCEPTANCE_FAILED \
            --infra-code DIFFERENTIAL_ACCEPTANCE_INFRA \
            -- bash -euo pipefail <<'TYPED_COMMAND'
          nix develop --no-update-lock-file --no-write-lock-file --command \
            bash -euo pipefail <<'DIFFERENTIAL_COMMAND'
          test_name="owner_scope_differential_acceptance"
          listing="$RUNNER_TEMP/owner-scope-differential-tests.txt"
          log="$RUNNER_TEMP/owner-scope-differential.log"
          command=(cargo test --manifest-path rust/Cargo.toml --test owner_scope \
            "$test_name" --locked --offline)
          "${command[@]}" -- --ignored --exact --list 2>&1 | tee "$listing"
          if [[ "$(grep -Ec "^${test_name}: test$" "$listing")" -ne 1 ]]; then
            echo "::error title=DIFFERENTIAL_TEST_SKIPPED::expected exactly one acceptance test"
            exit 1
          fi
          "${command[@]}" -- --ignored --exact --nocapture 2>&1 | tee "$log"
          record='^\{"code":"DIFFERENTIAL_ACCEPTANCE_PASSED","fixture_count":14,"python_adapter_sha256":"[0-9a-f]{64}","python_dispatch_sha256":"[0-9a-f]{64}","rust_artifact_sha256":"[0-9a-f]{64}","schema_version":"0.1","status":"PASS"\}$'
          if [[ "$(grep -Ec "$record" "$log")" -ne 1 ]]; then
            echo "::error title=DIFFERENTIAL_RECORD_MISSING::acceptance identity record missing or malformed"
            exit 1
          fi
          DIFFERENTIAL_COMMAND
          TYPED_COMMAND

      - name: Check reproducible environment
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          # LLM contract: locked proof run -> PASS | CODE_FAIL | INFRA_INCONCLUSIVE.
          set -euo pipefail
          started="$(date +%s)"
          log="$RUNNER_TEMP/proof-slow-nix.log"
          set +e
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-nix \
            --code NIX_PROOF_FAILED \
            --infra-code NIX_PROOF_INFRA \
            -- nix flake check --no-update-lock-file --no-write-lock-file \
              --print-build-logs 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          duration="$(($(date +%s) - started))"
          cache_state="warm"
          if grep -Eq '(^|[[:space:]])(building|copying path)[[:space:]]' "$log"; then
            cache_state="cold"
          fi
          if [[ "$status" -eq 0 ]]; then
            echo "PROOF_CACHE_STATE=$cache_state" >> "$GITHUB_ENV"
            printf '{"cache_state":"%s","classification":"CODE_OK","duration_seconds":%s,"gate":"proof-slow-nix","status":"PASS"}\n' \
              "$cache_state" "$duration"
            exit 0
          fi
          if [[ "$status" -eq 2 ]]; then
            printf '{"cache_state":"%s","classification":"INFRA_INCONCLUSIVE","duration_seconds":%s,"gate":"proof-slow-nix","status":"INCONCLUSIVE"}\n' \
              "$cache_state" "$duration"
            exit 2
          fi
          printf '{"cache_state":"%s","classification":"CODE_FAIL","duration_seconds":%s,"gate":"proof-slow-nix","status":"FAIL"}\n' \
            "$cache_state" "$duration"
          exit 1

      - name: Check shadow input byte stability
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-nix \
            --code SHADOW_INPUT_STABILITY_FAILED \
            --infra-code SHADOW_INPUT_INFRA \
            -- bash -euo pipefail <<'TYPED_COMMAND'
          # LLM contract: canonical shadow inputs -> two local rebuilds ->
          # identical NAR digests, or this candidate fails before merge.
          # Primary sources:
          # https://nix.dev/manual/nix/2.34/command-ref/new-cli/nix3-build
          # https://git-scm.com/docs/index-format
          # https://git-scm.com/docs/git-config#Documentation/git-config.txt-safedirectory
          set -euo pipefail
          target="path:.#shadow-inputs"
          rust_inputs="$(
            nix build --no-update-lock-file --no-write-lock-file \
              "$target" --no-link --print-out-paths
          )"
          rust_inputs_sha256="$(
            nix hash path --type sha256 --base16 "$rust_inputs"
          )"
          for attempt in 1 2; do
            rebuilt="$(
              nix build --no-update-lock-file --no-write-lock-file \
                "$target" --rebuild --no-link --print-out-paths
            )"
            rebuilt_sha256="$(nix hash path --type sha256 --base16 "$rebuilt")"
            if [[ "$rebuilt" != "$rust_inputs" ||
              "$rebuilt_sha256" != "$rust_inputs_sha256" ]]; then
              echo "::error title=SHADOW_INPUTS_NOT_REPRODUCIBLE::attempt=$attempt"
              exit 1
            fi
          done
          test ! -e "$rust_inputs/advisory-db/.git/index"
          git -c "safe.directory=$rust_inputs/advisory-db" \
            -C "$rust_inputs/advisory-db" rev-parse --verify 'HEAD^{commit}' \
            >/dev/null
          TYPED_COMMAND

      - name: Check locked Rust dependency policy
        if: needs.select.outputs.required == 'true'
        shell: bash
        run: |
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-nix \
            --code RUST_POLICY_FAILED \
            --infra-code RUST_POLICY_INFRA \
            -- bash -euo pipefail <<'TYPED_COMMAND'
          # LLM contract: unified catalog + Cargo.lock -> EXACT_RUST_CHECKS -> PASS or failure.
          # Primary source: https://github.com/rust-lang/rust/blob/8bab26f4f68e0e26f0bb7960be334d5b520ea452/src/tools/build-manifest/src/main.rs
          # Release manifest: https://static.rust-lang.org/dist/2026-07-16/channel-rust-1.97.1.toml
          set -euo pipefail
          locked_version() {
            nix develop --no-update-lock-file --no-write-lock-file --command \
              python scripts/toolchain_catalog.py \
                toolchain.lock.json --tool-version "$1"
          }
          assert_version() {
            local tool="$1"
            local actual="$2"
            local expected
            expected="$(locked_version "$tool")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=TOOLCHAIN_VERSION_MISMATCH::$tool expected=$expected actual=$actual"
              exit 1
            fi
          }
          rust_version="$(nix develop --no-update-lock-file --no-write-lock-file --command rustc --version | awk '{print $2}')"
          cargo_version="$(nix develop --no-update-lock-file --no-write-lock-file --command cargo --version | awk '{print $2}')"
          clippy_version="$(nix develop --no-update-lock-file --no-write-lock-file --command cargo-clippy --version | awk '{print $2}')"
          rust_analyzer_version="$(nix develop --no-update-lock-file --no-write-lock-file --command rust-analyzer --version | awk '{print $2}')"
          rustfmt_version="$(nix develop --no-update-lock-file --no-write-lock-file --command rustfmt --version | awk '{split($2, parts, "-"); print parts[1]}')"
          audit_version="$(nix develop --no-update-lock-file --no-write-lock-file --command cargo audit --version | awk '{print $NF}')"
          deny_version="$(nix develop --no-update-lock-file --no-write-lock-file --command cargo deny --version | awk '{print $NF}')"
          assert_version rust "$rust_version"
          assert_version cargo "$cargo_version"
          assert_version clippy "$clippy_version"
          assert_version rust-analyzer "$rust_analyzer_version"
          assert_version rustfmt "$rustfmt_version"
          assert_version cargo-audit "$audit_version"
          assert_version cargo-deny "$deny_version"
          rust_src="$(
            nix develop --no-update-lock-file --no-write-lock-file --command \
              rustc --print sysroot
          )/lib/rustlib/src/rust/library"
          test -d "$rust_src" || {
            echo "::error title=TOOLCHAIN_COMPONENT_MISSING::rust-src path=$rust_src"
            exit 1
          }
          nix develop --no-update-lock-file --no-write-lock-file --command \
            cargo audit --file rust/Cargo.lock
          nix develop --no-update-lock-file --no-write-lock-file --command \
            cargo deny --manifest-path rust/Cargo.toml --config rust/deny.toml \
            --locked --all-features check advisories bans licenses sources
          TYPED_COMMAND

      - name: Check locked Python toolchain and dependencies
        if: needs.select.outputs.required == 'true'
        shell: bash
        env:
          AUDIT_REQUIREMENTS: ${{ runner.temp }}/agent-work-governor-requirements.txt
          PIP_AUDIT_CACHE: ${{ runner.temp }}/pip-audit-cache
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
        run: |
          python3 scripts/run_typed_ci.py \
            --gate proof-slow-nix \
            --code PYTHON_POLICY_FAILED \
            --infra-code PYTHON_POLICY_INFRA \
            -- bash -euo pipefail <<'TYPED_COMMAND'
          # LLM contract: toolchain.lock + uv.lock -> EXACT_CHECKS -> PASS or non-zero exit.
          # Primary source: https://github.com/facebook/pyrefly/blob/b87de05834c401898c79fd9686b806c051dd3667/website/docs/installation.mdx
          set -euo pipefail
          run_locked() {
            nix develop --no-update-lock-file --no-write-lock-file --command "$@"
          }
          locked_version() {
            run_locked python scripts/toolchain_catalog.py \
              toolchain.lock.json --tool-version "$1"
          }
          assert_version() {
            local tool="$1"
            local actual="$2"
            local expected
            expected="$(locked_version "$tool")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error title=TOOLCHAIN_VERSION_MISMATCH::$tool expected=$expected actual=$actual"
              exit 1
            fi
          }
          run_locked python scripts/toolchain_catalog.py toolchain.lock.json
          assert_version uv "$(run_locked uv --version | awk '{print $2}')"
          assert_version python "$(run_locked python --version | awk '{print $2}')"
          assert_version ruff "$(run_locked ruff --version | awk '{print $2}')"
          assert_version pyrefly \
            "$(run_locked pyrefly --version | awk '{print $2}')"
          assert_version ty "$(run_locked ty --version | awk '{print $2}')"
          assert_version pip-audit \
            "$(run_locked pip-audit --version | awk '{print $2}')"
          run_locked uv lock --check
          run_locked ruff format --check .
          run_locked ruff check .
          run_locked pyrefly check
          run_locked ty check
          run_locked python -B -m unittest discover -s tests
          run_locked python scripts/validate_canonical.py --fetch-missing .
          run_locked uv export --quiet --locked --all-packages \
            --all-extras --all-groups --no-emit-workspace \
            --format requirements.txt \
            --output-file "$AUDIT_REQUIREMENTS"
          run_locked pip-audit --cache-dir "$PIP_AUDIT_CACHE" --disable-pip \
            --require-hashes --requirement "$AUDIT_REQUIREMENTS"
          TYPED_COMMAND

      - name: Report proof duration
        if: needs.select.outputs.required == 'true'
        run: |
          # LLM contract: completed proof job -> comparable duration and cache evidence.
          duration="$(($(date +%s) - PROOF_STARTED_EPOCH))"
          printf '{"cache_state":"%s","classification":"CODE_OK","duration_seconds":%s,"gate":"proof-slow-nix-total","status":"PASS"}\n' \
            "$PROOF_CACHE_STATE" "$duration"

  required:
    name: governor / validate
    if: always()
    needs: [select, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      METADATA_ONLY: ${{ github.event.action == 'edited' && github.event.changes.base == null }}
      METADATA_PROOF_PRESERVED: ${{ needs.select.outputs.preserved }}
      PROOF_REQUIRED: ${{ needs.select.outputs.required }}
      PROOF_RESULT: ${{ needs.nix.result }}
      SELECT_RESULT: ${{ needs.select.result }}
    steps:
      - name: Preserve the legacy required check
        run: |
          # LLM contract: path decision + proof result -> REQUIRED_PASS | CLOSED_FAILURE.
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '{"classification":"INFRA_INCONCLUSIVE","code":"PROOF_HEAD_INVALID","gate":"governor-required","status":"INCONCLUSIVE"}'
            exit 2
          fi
          if [[ "$SELECT_RESULT" != "success" ]]; then
            echo '{"classification":"INFRA_INCONCLUSIVE","code":"PROOF_SELECTION_INCONCLUSIVE","gate":"governor-required","status":"INCONCLUSIVE"}'
            exit 2
          fi
          if [[ "$METADATA_ONLY" == "true" &&
            "$METADATA_PROOF_PRESERVED" == "true" ]]; then
            printf '{"classification":"CODE_OK","gate":"governor-required","head_sha":"%s","proof_claim":"preserved-head","status":"PASS"}\n' \
              "$HEAD_SHA"
            exit 0
          fi
          if [[ "$METADATA_ONLY" == "true" &&
            "$METADATA_PROOF_PRESERVED" != "false" ]]; then
            echo '{"classification":"INFRA_INCONCLUSIVE","code":"PRIOR_REQUIRED_OUTPUT_INVALID","gate":"governor-required","status":"INCONCLUSIVE"}'
            exit 2
          fi
          if [[ "$PROOF_REQUIRED" == "false" &&
            "$PROOF_RESULT" == "success" ]]; then
            echo '{"classification":"CODE_OK","gate":"governor-required","proof_claim":"none","status":"PASS"}'
            exit 0
          fi
          if [[ "$PROOF_REQUIRED" == "true" &&
            "$PROOF_RESULT" == "success" ]]; then
            echo '{"classification":"CODE_OK","gate":"governor-required","proof_claim":"full-nix","status":"PASS"}'
            exit 0
          fi
          printf '{"classification":"CLOSED_FAILURE","code":"PROOF_REQUIRED_NOT_PASS","gate":"governor-required","proof_required":"%s","proof_result":"%s","status":"FAIL"}\n' \
            "$PROOF_REQUIRED" "$PROOF_RESULT"
          exit 1
