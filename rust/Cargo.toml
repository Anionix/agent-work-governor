# LLM-CONTRACT
# id: agent-work-governor.rust-package
# state: LOCKED_MANIFEST -> COMPILED_CRATE -> CHECKED_ARTIFACT | BUILD_FAILURE
# preconditions: Cargo.toml and Cargo.lock describe the same dependency graph
# invariant: unsafe code and warning-bearing Clippy configurations remain denied
# failure: Cargo, rustc, or Clippy exits non-zero
# source: bundle:knowledge/policies/work-governor.md
# knowledge: bundle:knowledge/policies/work-governor.md
# enforced_by: unsafe_code
# test: bundle:rust/tests/interface.rs

[package]
name = "agent-work-governor"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Fail-closed Rust validator for the Agent Work Governor plugin"
publish = false

[lib]
name = "agent_work_governor"
path = "src/lib.rs"

[[bin]]
name = "agent-work-governor"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.4", features = ["derive"] }
regex = "=1.13.1"
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
toml = "=1.1.3"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
